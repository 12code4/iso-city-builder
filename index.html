<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>City Builder — v0.4</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10141a; }
  #app { position: fixed; inset: 0; touch-action: none; }
  canvas { display: block; }
  .hud { position: fixed; font-family: -apple-system, "Segoe UI", Arial, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  #title { top: 12px; left: 14px; font-size: 14px; font-weight: 600; letter-spacing: 0.04em; opacity: 0.85; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
  #hint { top: 32px; left: 14px; font-size: 11px; opacity: 0.55; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
  #controls { bottom: 92px; right: 14px; display: flex; flex-direction: column; gap: 10px; }
  #controls button, #toolbar button {
    border: none; color: #fff; cursor: pointer; touch-action: manipulation;
    background: rgba(20, 26, 34, 0.65);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  #controls button { width: 48px; height: 48px; border-radius: 12px; font-size: 20px; }
  #controls button:active { background: rgba(20, 26, 34, 0.9); }
  #toolbar {
    bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; padding: 8px; border-radius: 16px;
    background: rgba(20, 26, 34, 0.5);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #toolbar button {
    min-width: 52px; height: 56px; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 20px; line-height: 1;
  }
  #toolbar button span { font-size: 9px; margin-top: 4px; opacity: 0.75; font-family: inherit; }
  #toolbar button.selected { background: rgba(120, 170, 220, 0.55); }
  #inspector {
    top: 54px; left: 14px; width: 208px; padding: 12px 14px; border-radius: 14px;
    background: rgba(20, 26, 34, 0.72);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    font-size: 12px; display: none;
  }
  #inspector.show { display: block; }
  #inspector .ins-name { font-size: 14px; font-weight: 600; margin-bottom: 3px; padding-right: 16px; }
  #inspector .ins-close { position: absolute; top: 9px; right: 11px; cursor: pointer; opacity: 0.55; font-size: 13px; }
  #inspector .ins-close:hover { opacity: 1; }
  #inspector .ins-state { opacity: 0.85; margin-bottom: 9px; }
  #inspector .lbl { display: flex; justify-content: space-between; font-size: 10px; opacity: 0.72; }
  #inspector .bar { height: 7px; border-radius: 4px; background: rgba(255,255,255,0.14); margin: 2px 0 7px; overflow: hidden; }
  #inspector .bar > i { display: block; height: 100%; border-radius: 4px; transition: width 0.15s linear; }
  #inspector .ins-foot { margin-top: 4px; font-size: 11px; opacity: 0.72; line-height: 1.5; }
  #inspector .ins-list { margin-top: 4px; font-size: 11px; opacity: 0.88; line-height: 1.6; }
  #inspector .ins-list a { color: #9fd0ff; cursor: pointer; }
  #inspector button.follow {
    margin-top: 11px; width: 100%; padding: 7px; border: none; border-radius: 9px;
    background: rgba(120, 170, 220, 0.5); color: #fff; cursor: pointer; font-size: 12px;
  }
  #inspector button.follow.on { background: rgba(120, 220, 150, 0.55); }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud" id="title">City Builder — v0.4</div>
<div class="hud" id="hint">Q/E rotate · WASD or drag to pan · wheel/pinch zoom · tap to build · 🔍 to inspect</div>
<div class="hud" id="census" style="top:12px; right:14px; font-size:12px; text-align:right; opacity:0.85; text-shadow:0 1px 3px rgba(0,0,0,0.4);"></div>
<div class="hud" id="inspector"></div>
<div class="hud" id="controls">
  <button id="btn-ccw" aria-label="Rotate left">⟲</button>
  <button id="btn-cw" aria-label="Rotate right">⟳</button>
</div>
<div class="hud" id="toolbar">
  <button data-tool="road">🛣️<span>Road</span></button>
  <button data-tool="house">🏠<span>House</span></button>
  <button data-tool="shop">🏪<span>Shop</span></button>
  <button data-tool="park">🏞️<span>Park</span></button>
  <button data-tool="bulldoze">🧨<span>Clear</span></button>
  <button data-tool="inspect">🔍<span>Inspect</span></button>
</div>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.164.1/three.module.min.js';

/* ============================== CONFIG ============================== */
const CONFIG = {
  grid: { size: 20, tile: 1 },
  colors: {
    sky:       0xdcecf5,   // soft pastel day sky
    grass:     0xc2e3aa,   // soft pastel green
    gridLine:  0xb0d99a,
    asphalt:   0x4a4f57, dash: 0xf0d97a, shoulder: 0x5a616b,
    road:      0x9aa0a8,   // light warm asphalt
    sidewalk:  0xece5d8,   // warm cream
    shopBody:  0xbcd6ef, shopRoof: 0xffffff, shopAwn: 0xf3a8c4,
    trunk:     0x9a7350, leaves: 0x8fc98a, leaves2: 0xa6dd9e,
    parkLawn:  0xcaeaad, bench: 0xb79a78, lamp: 0xffe6a8,
    window:    0x3d434c, windowLit: 0xffd98a,
    flowerA:   0xff9ec4, flowerB: 0xc4a6e6, flowerC: 0x9cc0ea, flowerD: 0xffffff,
    ghostOk:   0x9fe6a2, ghostBad: 0xe89a8f,
  },
  highway: { edge: 'south', width: 1, depth: 2 },  // 1-tile stub from edge center
  camera: {
    yawAngles: [45, 135, 225, 315],
    pitchDeg: 35.264,
    dist: 60,
    viewStart: 12,
    viewMin: 1.5, viewMax: 24,   // viewMin low = deep street-level immersion zoom
    rotateDur: 0.45,
    zoomLerp: 8,
    panKeySpeed: 1.2,      // keyboard pan: fraction of view height per second
    followLerp: 3,         // follow-camera: how fast the look-at chases a citizen
  },
  // Visual day/night cycle. INDEPENDENT of citizen dayLength — purely cosmetic,
  // never drives behaviour (the no-shared-clock rule stays intact).
  daynight: {
    cycleSeconds: 120, startT: 0.32,          // full sun→moon→sun in 120 real sec
    sunHeightMin: 6,                          // keep the sun elevated so shadows stay in-frustum
    nightSky: 0x0f1626, daySky: 0xdcecf5, warmSky: 0xf4b98a,
    sunMoon: 0x8090c8, sunDaylight: 0xfff2d8, sunDusk: 0xff9a4d,
    sunNight: 0.35, sunDay: 2.4,              // key-light intensity floor(night) + range(day)
    ambNightCol: 0x445674, ambDayCol: 0xbfd4e6, ambNight: 0.6, ambDay: 0.6,
    fogNight: 0.010, smokeSpawn: 0.012,
    glow: { window: 1.5, lamp: 1.4, sign: 1.1 },   // emissive brightness after dark
  },
  anim: { popDur: 0.3 },
  growth: { upgradeSeconds: 12, tickSeconds: 1 },
  input: { tapMaxMove: 10, pickRadius: 28 },   // px; pickRadius = inspect tap tolerance
  citizens: {
    timeScale: 1, decisionHz: 2,
    dayLength: 240,               // real seconds per in-game day (the anchor)
    residentsPerLevel: [0, 3, 5],
    carsPerLevel: [0, 1, 2],
    jobsPerShop: 4,
    rateJitter: 0.10,
    // Designer units below: hours and per-day amounts. Per-second rates
    // are derived ONCE at boot (see RT in the sim core). Tune here only.
    energy:  { sleepHours: 8, sleepBelow: 25, wakeAt: 95 },
    work:    { shiftHours: 6, recoverHours: 14, startBelow: 15 },
    needs:   { errands: { decayPerDay: 60 }, fun: { decayPerDay: 80 } },
    adverts: { shop: { need: 'errands', visitHours: 1.5, restore: 60 },
               park: { need: 'fun',     visitHours: 0.75, restore: 25 } },
    select:  { topK: 6, pickTemp: 1, distHalf: 8 },
    move:    { walkSpeed: 0.24, driveSpeed: 0.8, carMinDist: 3, carFullDist: 12,
               laneOffset: 0.18, walkOffset: 0.40 },   // right-hand traffic
    // Migration: moving trucks bring 1..maxLoad new residents in from the
    // highway edge, one truck in flight per house, staggered by dispatchHours.
    migration: { dispatchHours: 1.5, maxLoad: 3, truckSpeed: 0.7, dispatchJitter: 0.3,
                 maxConcurrent: 8 },   // ceiling on trucks on the map at once (anti-swarm)
    // Deterministic names from citizen id (first[id%N] + last[floor(id/N)%M]).
    names: {
      first: ['Ava','Ben','Cleo','Dan','Eve','Finn','Gia','Hugo','Ivy','Jack',
              'Kira','Leo','Mara','Nils','Ola','Pia','Quinn','Rex','Sara','Theo',
              'Uma','Vic','Wren','Xan','Yara','Zed'],
      last: ['Ash','Brook','Cole','Dune','Elm','Frost','Gale','Hart','Isle','Jung',
             'Knox','Lark','Moss','Nash','Oak','Poole','Reed','Stone','Vale','West'],
    },
    // Emoji bubbles: brief thought at decision points; complaint when a need is
    // starved with NO venue for it in town (diegetic "build a shop/park" hint).
    bubbles: { showSeconds: 3, starvedBelow: 22, complaintChance: 0.35,
               complaintCooldownHours: 5 },
  },
};

/* ============================ WORLD STATE =========================== */
// Single source of truth. Meshes are a projection of this array.
const world = [];
const S = CONFIG.grid.size;
for (let x = 0; x < S; x++) {
  world[x] = [];
  for (let z = 0; z < S; z++) {
    world[x][z] = { type: 'empty', level: 0, mesh: null, fixed: false,
                    connected: false, timer: 0 };
  }
}
const inBounds = (x, z) => x >= 0 && x < S && z >= 0 && z < S;
const NB4 = [[1,0],[-1,0],[0,1],[0,-1]];

/* ======================= RENDERER / SCENE SETUP ===================== */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(CONFIG.colors.sky);
const CENTER = new THREE.Vector3(S / 2, 0, S / 2);

const sun = new THREE.DirectionalLight(0xfff3e0, 2.6);
sun.position.set(S * 0.9, S * 1.1, S * 0.4);
sun.target.position.copy(CENTER);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -S; sc.right = S;              // widened for the moving (day/night) sun
sc.top = S; sc.bottom = -S;
sc.near = 1; sc.far = S * 3.5;
scene.add(sun, sun.target);
const ambient = new THREE.AmbientLight(0xbfd4e6, 1.1);   // ref kept for day/night
scene.add(ambient);
scene.fog = new THREE.FogExp2(CONFIG.colors.sky, 0.0);   // density animated at night

/* ============================== GROUND ============================== */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(S, S),
  new THREE.MeshStandardMaterial({ color: CONFIG.colors.grass, roughness: 0.95, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.copy(CENTER);
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(S, S, CONFIG.colors.gridLine, CONFIG.colors.gridLine);
grid.position.set(S / 2, 0.005, S / 2);
grid.material.opacity = 0.18;   // soft, unobtrusive
grid.material.transparent = true;
scene.add(grid);

/* ========================== MESH FACTORIES ========================== */
// Cozy-pastel art direction (v0.4). Meshes stay a pure projection of `world`.
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, metalness: 0, ...o });
const CL = CONFIG.colors;

// Per-house pastel sets (pink / lavender / blue / mint / peach), shared and
// picked deterministically per tile — variety with no per-frame randomness.
const CUTE = [
  { wall: 0xfbe3ee, roof: 0xf3a8c4, trim: 0xe98bb0 },
  { wall: 0xece3f7, roof: 0xc4a6e6, trim: 0xa87fd0 },
  { wall: 0xe2edfa, roof: 0x9cc0ea, trim: 0x77a6dd },
  { wall: 0xe6f4ec, roof: 0xa6ddc0, trim: 0x7fc9a0 },
  { wall: 0xfdeede, roof: 0xf3b58a, trim: 0xe49a66 },
];
const cuteMats = CUTE.map(c => ({ wall: M(c.wall), roof: M(c.roof), trim: M(c.trim) }));
const flowerMats = [CL.flowerA, CL.flowerB, CL.flowerC, CL.flowerD].map(c => M(c));

// Shared emissive materials the day/night cycle drives each frame.
const windowMat = M(CL.window, { emissive: new THREE.Color(CL.windowLit), emissiveIntensity: 0 });
const lampMat   = M(CL.lamp,   { emissive: new THREE.Color(CL.lamp),      emissiveIntensity: 0.12 });
const signMat   = M(0xfff2d6,  { emissive: new THREE.Color(0xffe6a0),     emissiveIntensity: 0.12 });
const emissiveMats = [windowMat, lampMat, signMat];

const mats = {
  asphalt: M(CL.asphalt), dash: M(CL.dash), shoulder: M(CL.shoulder),
  road: M(CL.road), sidewalk: M(CL.sidewalk),
  shopBody: M(CL.shopBody), shopRoof: M(CL.shopRoof), shopAwn: M(CL.shopAwn),
  trunk: M(CL.trunk), leaves: M(CL.leaves), leaves2: M(CL.leaves2),
  parkLawn: M(CL.parkLawn), bench: M(CL.bench),
  box: M(0x8a6a4a), pole: M(0x5a5f66),
};
const geos = {
  slab: new THREE.BoxGeometry(1, 0.06, 1),
  roadSlab: new THREE.BoxGeometry(0.76, 0.06, 0.76),
  walkSlab: new THREE.BoxGeometry(1, 0.045, 1),
  dash: new THREE.BoxGeometry(0.05, 0.012, 0.24),
  house1: new THREE.BoxGeometry(0.6, 0.5, 0.6),
  house2: new THREE.BoxGeometry(0.66, 0.82, 0.66),
  roof: new THREE.ConeGeometry(0.52, 0.36, 4),
  chimney: new THREE.BoxGeometry(0.1, 0.2, 0.1),
  door: new THREE.BoxGeometry(0.16, 0.24, 0.02),
  win: new THREE.BoxGeometry(0.13, 0.16, 0.02),
  flowerBox: new THREE.BoxGeometry(0.17, 0.05, 0.05),
  flower: new THREE.SphereGeometry(0.026, 6, 5),
  shopBody: new THREE.BoxGeometry(0.8, 0.42, 0.8),
  shopRoof: new THREE.BoxGeometry(0.88, 0.07, 0.88),
  awning: new THREE.BoxGeometry(0.84, 0.04, 0.2),
  sign: new THREE.BoxGeometry(0.4, 0.13, 0.02),
  trunk: new THREE.CylinderGeometry(0.06, 0.08, 0.28, 6),
  leaves: new THREE.SphereGeometry(0.27, 10, 8),
  lawn: new THREE.BoxGeometry(0.94, 0.05, 0.94),
  bench: new THREE.BoxGeometry(0.3, 0.08, 0.12),
  lampPole: new THREE.CylinderGeometry(0.02, 0.025, 0.5, 6),
  lampHead: new THREE.SphereGeometry(0.06, 10, 8),
};

function shadowed(m) { m.castShadow = true; m.receiveShadow = true; return m; }
const hash = (x, z) => Math.abs((x * 73856093) ^ (z * 19349663));

function addWindows(g, w, h, d, y, cols) {   // glowing windows + cute flower boxes
  for (let i = 0; i < cols; i++) {
    const wx = -w / 2 + w * (i + 1) / (cols + 1);
    const win = new THREE.Mesh(geos.win, windowMat); win.position.set(wx, y, d / 2 + 0.001); g.add(win);
    const box = new THREE.Mesh(geos.flowerBox, mats.box); box.position.set(wx, y - 0.12, d / 2 + 0.03); g.add(box);  // no shadow (tiny)
    for (let k = 0; k < 3; k++) {
      const f = new THREE.Mesh(geos.flower, flowerMats[k % flowerMats.length]);
      f.position.set(wx - 0.05 + k * 0.05, y - 0.08, d / 2 + 0.04); g.add(f);
    }
  }
}

const factories = {
  highway(x, z) {
    const m = new THREE.Mesh(geos.slab, mats.asphalt);
    m.position.set(x + 0.5, 0.03, z + 0.5); m.receiveShadow = true; return m;
  },
  road(x, z) {
    const g = new THREE.Group();
    const walk = new THREE.Mesh(geos.walkSlab, mats.sidewalk); walk.position.y = 0.0225; walk.receiveShadow = true;
    const asphalt = new THREE.Mesh(geos.roadSlab, mats.road); asphalt.position.y = 0.032; asphalt.receiveShadow = true;
    const dash = new THREE.Mesh(geos.dash, mats.dash); dash.position.y = 0.062;
    g.add(walk, asphalt, dash);
    if (hash(x, z) % 4 === 0) {                 // a street lamp on ~1/4 of tiles — glows at night
      const pole = shadowed(new THREE.Mesh(geos.lampPole, mats.pole)); pole.position.set(0.4, 0.25, 0.4);
      const head = new THREE.Mesh(geos.lampHead, lampMat); head.position.set(0.4, 0.52, 0.4);
      g.add(pole, head);
    }
    g.position.set(x + 0.5, 0, z + 0.5);
    return g;
  },
  house(x, z, level) {
    const g = new THREE.Group();
    const two = level >= 2;
    const cc = cuteMats[hash(x, z) % cuteMats.length];
    const w = two ? 0.66 : 0.6, h = two ? 0.82 : 0.5, d = w;
    const base = shadowed(new THREE.Mesh(two ? geos.house2 : geos.house1, cc.wall)); base.position.y = h / 2 + 0.03;
    const roof = shadowed(new THREE.Mesh(geos.roof, cc.roof)); roof.position.y = h + 0.03 + 0.18;
    roof.rotation.y = Math.PI / 4; roof.scale.setScalar(w / 0.6);
    const door = new THREE.Mesh(geos.door, cc.trim); door.position.set(0, 0.15, d / 2 + 0.001);
    const chimney = new THREE.Mesh(geos.chimney, cc.roof); chimney.position.set(w * 0.28, h + 0.13, d * 0.2);  // no shadow (tiny)
    g.add(base, roof, door, chimney);
    addWindows(g, w, h, d, two ? 0.55 : 0.3, two ? 2 : 1);
    for (let k = 0; k < 4; k++) {                // garden flowers by the door
      const f = new THREE.Mesh(geos.flower, flowerMats[(hash(x, z) + k) % flowerMats.length]);
      f.position.set(-0.13 + k * 0.085, 0.05, d / 2 + 0.14); g.add(f);
    }
    g.position.set(x + 0.5, 0, z + 0.5);
    return g;
  },
  shop(x, z) {
    const g = new THREE.Group();
    const body = shadowed(new THREE.Mesh(geos.shopBody, mats.shopBody)); body.position.y = 0.24;
    const roof = shadowed(new THREE.Mesh(geos.shopRoof, mats.shopRoof)); roof.position.y = 0.47;
    const awn = shadowed(new THREE.Mesh(geos.awning, mats.shopAwn)); awn.position.set(0, 0.28, 0.43);
    const sign = new THREE.Mesh(geos.sign, signMat); sign.position.set(0, 0.42, 0.42);
    g.add(body, roof, awn, sign);
    addWindows(g, 0.8, 0.42, 0.8, 0.26, 3);
    g.position.set(x + 0.5, 0, z + 0.5);
    return g;
  },
  park(x, z) {
    const g = new THREE.Group();
    const lawn = new THREE.Mesh(geos.lawn, mats.parkLawn); lawn.position.y = 0.025; lawn.receiveShadow = true; g.add(lawn);
    for (const [ox, oz, s, lm] of [[-0.22, -0.18, 1, mats.leaves], [0.2, 0.15, 0.82, mats.leaves2]]) {
      const trunk = shadowed(new THREE.Mesh(geos.trunk, mats.trunk)); trunk.position.set(ox, 0.14 * s, oz); trunk.scale.setScalar(s);
      const leaves = shadowed(new THREE.Mesh(geos.leaves, lm)); leaves.position.set(ox, 0.42 * s, oz); leaves.scale.setScalar(s);
      g.add(trunk, leaves);
    }
    const bench = shadowed(new THREE.Mesh(geos.bench, mats.bench)); bench.position.set(0.05, 0.09, -0.3); g.add(bench);
    for (let k = 0; k < 5; k++) {                // a little flowerbed
      const f = new THREE.Mesh(geos.flower, flowerMats[(hash(x, z) + k) % flowerMats.length]);
      f.position.set(-0.34 + k * 0.17, 0.06, 0.33); g.add(f);
    }
    g.rotation.y = (hash(x, z) % 4) * Math.PI / 2;
    g.position.set(x + 0.5, 0, z + 0.5);
    return g;
  },
};

/* ============================= syncTile ============================= */
function syncTile(x, z, pop = false) {
  const t = world[x][z];
  if (t.mesh) { scene.remove(t.mesh); t.mesh = null; }
  const make = factories[t.type];
  if (make) {
    t.mesh = make(x, z, t.level);
    t.mesh.userData = { kind: 'building', x, z };   // for inspector raycast
    scene.add(t.mesh);
    if (pop) startPop(t.mesh);
  }
}

/* ========================== POP ANIMATION =========================== */
const anims = [];
function startPop(mesh) {
  mesh.scale.setScalar(0.001);
  anims.push({ mesh, t: 0 });
}
function backOut(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function updateAnims(dt) {
  for (let i = anims.length - 1; i >= 0; i--) {
    const a = anims[i];
    a.t = Math.min(1, a.t + dt / CONFIG.anim.popDur);
    a.mesh.scale.setScalar(Math.max(0.001, backOut(a.t)));
    if (a.t >= 1) { a.mesh.scale.setScalar(1); anims.splice(i, 1); }
  }
}

/* ======================= HIGHWAY (pre-placed) ======================= */
// A stub entering from the center of one map edge: `width` tiles wide,
// `depth` tiles into the map. Its outer end sits on the map edge — the
// outside connection. Player roads attach to the inner end or sides.
const HW = CONFIG.highway;
const cs = Math.floor(S / 2 - HW.width / 2);      // centered span start
const hwAxis = (HW.edge === 'south' || HW.edge === 'north') ? 'z' : 'x';
const hwTiles = [];
if (hwAxis === 'z') {
  const z0 = HW.edge === 'south' ? 0 : S - HW.depth;
  for (let dx = 0; dx < HW.width; dx++)
    for (let dz = 0; dz < HW.depth; dz++) hwTiles.push([cs + dx, z0 + dz]);
} else {
  const x0 = HW.edge === 'west' ? 0 : S - HW.depth;
  for (let dx = 0; dx < HW.depth; dx++)
    for (let dz = 0; dz < HW.width; dz++) hwTiles.push([x0 + dx, cs + dz]);
}
for (const [x, z] of hwTiles) {
  const t = world[x][z];
  t.type = 'highway'; t.fixed = true;
  syncTile(x, z);
}
// Dashed center seam + shoulder strips, oriented along the travel axis.
const minX = Math.min(...hwTiles.map(t => t[0]));
const minZ = Math.min(...hwTiles.map(t => t[1]));
const dashGeo = hwAxis === 'z'

/* ========================== CONNECTIVITY ============================ */
// BFS from the highway over road+highway tiles. Run on road changes only.
function recomputeConnectivity() {
  const queue = [];
  for (let x = 0; x < S; x++) for (let z = 0; z < S; z++) {
    const t = world[x][z];
    t.connected = false;
    if (t.type === 'highway') { t.connected = true; queue.push([x, z]); }
  }
  while (queue.length) {
    const [x, z] = queue.pop();
    for (const [dx, dz] of NB4) {
      const nx = x + dx, nz = z + dz;
      if (!inBounds(nx, nz)) continue;
      const n = world[nx][nz];
      if (n.type === 'road' && !n.connected) {
        n.connected = true;
        queue.push([nx, nz]);
      }
    }
  }
}
recomputeConnectivity();

/* ========================= GROWTH (slow tick) ======================= */
// v0.2 rule: building frontage requires a connected ROAD. Highway tiles
// no longer count (no pedestrian access).
function hasConnectedRoadNeighbor(x, z) {
  return NB4.some(([dx, dz]) => {
    const nx = x + dx, nz = z + dz;
    if (!inBounds(nx, nz)) return false;
    const n = world[nx][nz];
    return n.type === 'road' && n.connected;
  });
}
let growthAcc = 0;
function growthTick(dt) {
  growthAcc += dt;
  if (growthAcc < CONFIG.growth.tickSeconds) return;
  growthAcc = 0;
  for (let x = 0; x < S; x++) for (let z = 0; z < S; z++) {
    const t = world[x][z];
    if (t.type !== 'house' || t.level >= 2) continue;
    if (hasConnectedRoadNeighbor(x, z)) {
      t.timer += CONFIG.growth.tickSeconds;
      if (t.timer >= CONFIG.growth.upgradeSeconds) {
        t.level = 2;
        syncTile(x, z, true);
        onHouseUpgraded(x, z);
      }
    }
  }
}

// Headless citizen simulation. No rendering — the census HUD is the proof.
// All rates are per game-second; meters clamp 0..100.
const CZ = CONFIG.citizens;
// Derived runtime rates: designer units (hours, per-day) -> per-second.
const HOUR = CZ.dayLength / 24;
const RT = {
  energyDecay: (CZ.energy.wakeAt - CZ.energy.sleepBelow) /
               ((24 - CZ.energy.sleepHours) * HOUR),
  sleepFill:   (CZ.energy.wakeAt - CZ.energy.sleepBelow) /
               (CZ.energy.sleepHours * HOUR),
  workFill:    100 / (CZ.work.shiftHours * HOUR),
  workDecay:   (100 - CZ.work.startBelow) / (CZ.work.recoverHours * HOUR),
  needDecay:   Object.fromEntries(Object.entries(CZ.needs)
                 .map(([k, v]) => [k, v.decayPerDay / CZ.dayLength])),
  adverts:     Object.fromEntries(Object.entries(CZ.adverts)
                 .map(([k, a]) => [k, {
                   need: a.need,
                   minStay: a.visitHours * HOUR,
                   fillRate: a.restore / (a.visitHours * HOUR),
                 }])),
  minShift:    CZ.work.shiftHours * HOUR,
  dispatchInterval: CZ.migration.dispatchHours * HOUR,   // secs between truck runs
  complaintCooldown: CZ.bubbles.complaintCooldownHours * HOUR,
};
let gameTime = 0;
let nextCitizenId = 1;
let nextTruckId = 1;
const citizens = [];
const citizenById = new Map();     // id -> citizen, for O(1) lookups (bubbles, cards)
const trucks = [];      // transient moving-truck deliveries (not citizens)
const clamp01_100 = v => Math.max(0, Math.min(100, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const key = (x, z) => x * S + z;

/* ---- Dijkstra map: one BFS flood answers every distance query ---- */
function dijkstraMap(sources, drive) {
  const dist = new Int16Array(S * S).fill(-1);
  const q = [];
  for (const [x, z] of sources) {
    const t = world[x][z];
    if (t.type === 'road' || (drive && t.type === 'highway')) {
      dist[key(x, z)] = 0; q.push([x, z]);
    }
  }
  for (let h = 0; h < q.length; h++) {
    const [x, z] = q[h];
    const d = dist[key(x, z)];
    for (const [dx, dz] of NB4) {
      const nx = x + dx, nz = z + dz;
      if (!inBounds(nx, nz) || dist[key(nx, nz)] !== -1) continue;
      const n = world[nx][nz];
      if (n.type === 'road' || (drive && n.type === 'highway')) {
        dist[key(nx, nz)] = d + 1; q.push([nx, nz]);
      }
    }
  }
  return dist;
}
function roadAdjacents(x, z) {
  const out = [];
  for (const [dx, dz] of NB4) {
    const nx = x + dx, nz = z + dz;
    if (inBounds(nx, nz) && world[nx][nz].type === 'road') out.push([nx, nz]);
  }
  return out;
}
// Road distance from a flood to a building tile (min over its frontage).
function tileDist(flood, x, z) {
  let best = -1;
  for (const [rx, rz] of roadAdjacents(x, z)) {
    const d = flood[key(rx, rz)];
    if (d !== -1 && (best === -1 || d < best)) best = d;
  }
  return best === -1 ? -1 : best + 1;
}
function floodFrom(x, z, drive) {           // flood from a tile's frontage
  const t = world[x][z];                    // (or the tile itself, if it's road)
  const src = (t.type === 'road' || (drive && t.type === 'highway'))
    ? [[x, z]] : roadAdjacents(x, z);
  return dijkstraMap(src, drive);
}

/* ---- Lifecycle: houses make citizens, shops make jobs ---- */
function makeCitizen(hx, hz) {
  const j = 1 + rnd(-CZ.rateJitter, CZ.rateJitter);   // per-citizen rate jitter
  const awake = Math.random() < 0.5;    // half start awake: instant street life
  return {
    id: nextCitizenId++, home: [hx, hz], at: [hx, hz], job: null,
    state: awake ? 'free_time' : 'sleep', phase: 'doing', mode: 'walk',
    dest: null, travelT: 0, stayUntil: 0, activity: null,
    meters: { energy: rnd(35, 90), work: rnd(10, 80),
              errands: rnd(30, 80), fun: rnd(30, 80) },
    rates: { energyDecay: RT.energyDecay * j, sleepFill: RT.sleepFill * j,
             workDecay: RT.workDecay * j, workFill: RT.workFill * j,
             errandsDecay: RT.needDecay.errands * j,

}
// Residents no longer appear instantly: the house queues `pending` arrivals
// and moving trucks deliver them from the highway (see MIGRATION section).
function onHousePlaced(x, z) {

  t.pending = CZ.residentsPerLevel[1];
  t.nextDispatch = gameTime;       // eligible for a truck right away
  t.truckInFlight = false;
}
function onHouseUpgraded(x, z) {
  const t = world[x][z];
  const addCars = CZ.carsPerLevel[2] - CZ.carsPerLevel[1];
  t.cars.total += addCars; t.cars.available += addCars;
  t.pending = (t.pending || 0) + (CZ.residentsPerLevel[2] - CZ.residentsPerLevel[1]);
  if (!t.truckInFlight) t.nextDispatch = gameTime;   // new residents eligible now
  if (typeof refreshChimneys === 'function') refreshChimneys();   // chimney rose with the roof
}
function onShopPlaced(x, z) {
  world[x][z].jobs = { total: CZ.jobsPerShop, workers: [] };
  // One flood from the shop hires the nearest unemployed (walk network).
  const flood = floodFrom(x, z, false);
  const open = citizens.filter(c => !c.job)
    .map(c => [tileDist(flood, c.home[0], c.home[1]), c])
    .filter(([d]) => d !== -1)
    .sort((a, b) => a[0] - b[0]);
  for (const [, c] of open.slice(0, CZ.jobsPerShop)) hire(c, x, z);
}
function hire(c, x, z) {
  c.job = [x, z];
  world[x][z].jobs.workers.push(c.id);
}
function tryEmploy(c) {
  const flood = floodFrom(c.home[0], c.home[1], false);
  let best = null, bestD = -1;
  for (let x = 0; x < S; x++) for (let z = 0; z < S; z++) {
    const t = world[x][z];
    if (t.type !== 'shop' || !t.jobs || t.jobs.workers.length >= t.jobs.total) continue;
    const d = tileDist(flood, x, z);
    if (d !== -1 && (bestD === -1 || d < bestD)) { bestD = d; best = [x, z]; }
  }

}
function onHouseRemoved(x, z) {
  for (let i = citizens.length - 1; i >= 0; i--) {
    const c = citizens[i];
    if (c.home[0] === x && c.home[1] === z) {
      if (c.job) {
        const jt = world[c.job[0]][c.job[1]];
        if (jt.jobs) jt.jobs.workers = jt.jobs.workers.filter(id => id !== c.id);
      }
      citizenById.delete(c.id);
      citizens.splice(i, 1);
    }
  }

}
function onShopRemoved(x, z) {
  const t = world[x][z];
  if (!t.jobs) return;
  for (const c of citizens) {
    if (c.job && c.job[0] === x && c.job[1] === z) c.job = null;
  }
  delete t.jobs;

/* ---- Movement: real paths (M6). Walk downhill through the flood. ---- */
function speedFor(mode) {
  return mode === 'drive' ? CZ.move.driveSpeed : CZ.move.walkSpeed;
}
// Build the trip: descend the Dijkstra map from the destination's frontage
// back to the source, then offset the polyline to sidewalk/lane, right-hand.
function beginTravel(c, dest, flood) {
  const dTile = world[dest[0]][dest[1]];
  const front = (dTile.type === 'road' || dTile.type === 'highway')
    ? [dest] : roadAdjacents(dest[0], dest[1]);
  let bx = -1, bz = -1, bd = -1;
  for (const [rx, rz] of front) {
    const d = flood[key(rx, rz)];
    if (d !== -1 && (bd === -1 || d < bd)) { bd = d; bx = rx; bz = rz; }
  }
  if (bd === -1) return false;
  const tiles = [[bx, bz]];
  let tx = bx, tz = bz, guard = S * S;
  while (flood[key(tx, tz)] > 0 && guard-- > 0) {
    const d = flood[key(tx, tz)];
    for (const [dx, dz] of NB4) {
      const nx = tx + dx, nz = tz + dz;
      if (inBounds(nx, nz) && flood[key(nx, nz)] === d - 1) { tx = nx; tz = nz; break; }
    }
    tiles.push([tx, tz]);
  }
  tiles.reverse();                          // source frontage → dest frontage
  const full = [c.at, ...tiles, dest];
  const off = c.mode === 'drive' ? CZ.move.laneOffset : CZ.move.walkOffset;
  const pts = [];
  for (let i = 0; i < full.length - 1; i++) {
    const [ax, az] = full[i], [bx2, bz2] = full[i + 1];
    const hx = Math.sign(bx2 - ax), hz = Math.sign(bz2 - az);
    if (hx === 0 && hz === 0) continue;     // duplicate tiles collapse
    const rx = -hz * off, rz = hx * off;    // right-hand side of heading
    pts.push([ax + 0.5 + rx, az + 0.5 + rz]);
    pts.push([bx2 + 0.5 + rx, bz2 + 0.5 + rz]);
  }
  if (pts.length === 0)                     // zero-length trip: arrive in place
    pts.push([c.at[0] + 0.5, c.at[1] + 0.5], [dest[0] + 0.5, dest[1] + 0.5]);
  c.dest = dest; c.phase = 'traveling';
  c.pathPts = pts; c.seg = 0;
  c.pos = [pts[0][0], pts[0][1]];

}
// Advance any mover (citizen or truck) along its polyline. Returns true once
// the polyline is exhausted. Shared by updateTravel and updateTrucks.
function advanceAlong(m, move) {
  while (move > 0) {
    const b = m.pathPts[m.seg + 1];
    if (!b) return true;
    const dx = b[0] - m.pos[0], dz = b[1] - m.pos[1];
    const len = Math.hypot(dx, dz);
    if (len < 1e-6) { m.seg++; continue; }
    m.heading = [dx / len, dz / len];
    if (move >= len) { m.pos = [b[0], b[1]]; m.seg++; move -= len; }
    else { m.pos = [m.pos[0] + dx / len * move, m.pos[1] + dz / len * move]; move = 0; }
  }
  return false;
}
// Per-frame advance along the polyline. Runs on game time, not tick time.
function updateTravel(dtGame) {
  for (const c of citizens) {
    if (c.phase !== 'traveling' || !c.pathPts) continue;
    if (advanceAlong(c, speedFor(c.mode) * dtGame)) { c.pathPts = null; arrive(c); }
  }
}
// Road network changed under someone's feet: re-plan everyone traveling.
function replanTravelers() {
  for (const c of citizens) {
    if (c.phase !== 'traveling') continue;
    c.at = [Math.floor(c.pos[0]), Math.floor(c.pos[1])];
    const flood = floodFrom(c.at[0], c.at[1], c.mode === 'drive');
    if (beginTravel(c, c.dest, flood)) continue;      // same trip, new route
    if (beginTravel(c, c.home, flood)) continue;      // trip dead: walk home
    c.phase = 'doing'; c.activity = null;             // stranded: idle, retry
    c.state = 'free_time';
    c.stayUntil = gameTime + 5;
    c.pathPts = null;
  }
}

/* -------------------- MIGRATION: moving trucks --------------------- */
// A truck is a transient delivery vehicle: not a citizen, so no meters and no
// FSM (the "exactly three states" rule is untouched). It drives in from the
// highway edge, parks at a house's curb, drops off 1..maxLoad new residents,
// then drives back out and despawns. This is the minimal seed of the later
// "visitor framework" (roadmap Pillar B).
const HW_EDGE = hwTiles.find(([x, z]) => x === 0 || x === S - 1 || z === 0 || z === S - 1)
                || hwTiles[0];
function bestFrontageTile(x, z, flood) {       // reachable road tile at a curb
  let bx = -1, bz = -1, bd = -1;
  for (const [rx, rz] of roadAdjacents(x, z)) {
    const d = flood[key(rx, rz)];
    if (d !== -1 && (bd === -1 || d < bd)) { bd = d; bx = rx; bz = rz; }
  }
  return bd === -1 ? null : [bx, bz];

  const t = world[x][z];

  if (!front) return false;                    // house unreachable: wait for a road
  const load = 1 + Math.floor(Math.random() * Math.min(CZ.migration.maxLoad, t.pending));
  const truck = { id: nextTruckId++, target: [x, z], frontage: front,
                  leg: 'inbound', load, at: [HW_EDGE[0], HW_EDGE[1]], mode: 'drive' };
  if (!beginTravel(truck, front, flood)) return false;
  trucks.push(truck);

  return true;
}
function migrationTick() {
  const cap = CZ.migration.maxConcurrent;
  let flood = null;                            // build the HW_EDGE flood once per tick
  for (let x = 0; x < S; x++) for (let z = 0; z < S; z++) {
    if (trucks.length >= cap) return;          // concurrency ceiling: rest wait a tick
    const t = world[x][z];
    if (t.type !== 'house' || !t.pending || t.pending <= 0) continue;
    if (t.truckInFlight || gameTime < (t.nextDispatch || 0)) continue;
    if (!flood) flood = floodFrom(HW_EDGE[0], HW_EDGE[1], true);
    if (!dispatchTruck(x, z, flood)) t.nextDispatch = gameTime + RT.dispatchInterval;
  }

function truckArrive(truck) {

      for (let i = 0; i < truck.load && (ht.pending || 0) > 0; i++) {
        ht.pending--;
        const c = makeCitizen(hx, hz);
        citizens.push(c); citizenById.set(c.id, c); tryEmploy(c);
      }
      ht.truckInFlight = false;
      const j = CZ.migration.dispatchJitter;   // stagger the next run (no shared clock)
      ht.nextDispatch = gameTime + RT.dispatchInterval * (1 - j + Math.random() * 2 * j);
    }
    truck.leg = 'outbound';                     // head back to the highway edge
    truck.at = [truck.frontage[0], truck.frontage[1]];
    const flood = floodFrom(truck.at[0], truck.at[1], true);

function updateTrucks(dtGame) {
  if (trucks.length === 0) return;
  const spd = CZ.migration.truckSpeed;
  for (let i = trucks.length - 1; i >= 0; i--) {   // reverse: safe against despawn splices
    const truck = trucks[i];

// Road network changed: re-route trucks (the truck analogue of replanTravelers).
function replanTrucks() {
  for (const truck of [...trucks]) {
    truck.at = [Math.floor(truck.pos[0]), Math.floor(truck.pos[1])];
    const flood = floodFrom(truck.at[0], truck.at[1], true);
    if (truck.leg === 'inbound') {
      const ht = world[truck.target[0]][truck.target[1]];
      if (ht.type === 'house') {
        const front = bestFrontageTile(truck.target[0], truck.target[1], flood);
        if (front) { truck.frontage = front; if (beginTravel(truck, front, flood)) continue; }
        ht.truckInFlight = false;              // house unreachable now: give up, re-queue later
      }
      truck.leg = 'outbound';
      if (beginTravel(truck, HW_EDGE, flood)) continue;
      despawnTruck(truck);

      truck.leg = 'outbound';
      truck.at = [Math.floor(truck.pos[0]), Math.floor(truck.pos[1])];

// A road was just placed/removed: let waiting houses try for a truck at once.
function nudgeMigration() {
  for (let x = 0; x < S; x++) for (let z = 0; z < S; z++) {
    const t = world[x][z];
    if (t.type === 'house' && t.pending > 0 && !t.truckInFlight) t.nextDispatch = gameTime;
  }

// Mode roll happens ONCE, at home departure, gated by car availability.
function rollModeAtDeparture(c, firstDist) {

  c.mode = 'walk';
  if (!home.cars || home.cars.available <= 0) return;
  const p = Math.max(0, Math.min(1,
    (firstDist - CZ.move.carMinDist) / (CZ.move.carFullDist - CZ.move.carMinDist)));
  if (Math.random() < p) { c.mode = 'drive'; home.cars.available--; }
}

  if (home.cars) home.cars.available = Math.min(home.cars.total, home.cars.available + 1);
  c.mode = 'walk';

/* ---- Free-time decision procedure (locked spec) ---- */
function chooseFreeTime(c) {
  c.state = 'free_time';
  const [cx, cz] = c.at;
  const flood = floodFrom(cx, cz, c.mode === 'drive');
  const cands = [];
  for (let x = 0; x < S; x++) for (let z = 0; z < S; z++) {
    const t = world[x][z], ad = RT.adverts[t.type];
    if (!ad) continue;
    const here = (x === cx && z === cz);
    const d = here ? 0 : tileDist(flood, x, z);
    if (d === -1) continue;
    const urgency = (100 - c.meters[ad.need]) / 100;
    const proximity = 1 / (1 + d / CZ.select.distHalf);
    const score = ad.fillRate * ad.minStay * urgency * proximity;
    if (score > 0) cands.push({ x, z, d, ad, score });
  }
  if (cands.length === 0) {                 // nowhere to go: idle where we are
    c.phase = 'doing'; c.activity = null;
    c.stayUntil = gameTime + 5;
    return;
  }
  cands.sort((a, b) => b.score - a.score);
  const top = cands.slice(0, CZ.select.topK);
  const weights = top.map(o => Math.pow(o.score, CZ.select.pickTemp));
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  let pick = top[0];
  for (let i = 0; i < top.length; i++) { r -= weights[i]; if (r <= 0) { pick = top[i]; break; } }
  if (pick.x === cx && pick.z === cz) {     // stay: restart minStay commitment
    c.phase = 'doing'; c.activity = pick.ad;
    c.stayUntil = gameTime + pick.ad.minStay;
  } else if (beginTravel(c, [pick.x, pick.z], flood)) {
    showBubble(c, pick.ad.need === 'errands' ? '🛒' : '🎈');   // off to a venue
  } else {
    c.phase = 'doing'; c.activity = null;   // route vanished: idle and retry
    c.stayUntil = gameTime + 5;
  }
}
function goWork(c) {

  if (!beginTravel(c, c.home, flood)) {

    c.stayUntil = gameTime + 5;                           // stranded: retry

}

  const wantsWork = c.job && c.meters.work <= CZ.work.startBelow;
  const flood = floodFrom(c.home[0], c.home[1], true);  // measure on drive net
  let dest = null, d = -1;
  if (wantsWork) { d = tileDist(flood, c.job[0], c.job[1]); dest = 'work'; }
  if (d === -1) {
    // No job trip — leave for free time (distance estimate for the roll: median-ish)
    rollModeAtDeparture(c, 6);

  }

}
function arrive(c) {

  const [x, z] = c.at;
  if (x === c.home[0] && z === c.home[1]) returnCarIfAny(c);  // excursion over
  const t = world[x][z];
  if (c.state === 'free_time') {
    const ad = RT.adverts[t.type];
    if (!ad) { chooseFreeTime(c); return; }       // venue bulldozed mid-walk
    c.activity = ad;
    c.stayUntil = gameTime + ad.minStay;
  } else if (c.state === 'work') {
    if (t.type !== 'shop' || !c.job) { chooseFreeTime(c); return; }

/* ---- The FSM tick ---- */
function tickCitizen(c, dt) {
  const m = c.meters, R = c.rates;
  // Meters
  if (c.state === 'sleep' && c.phase === 'doing') m.energy += R.sleepFill * dt;
  else m.energy -= R.energyDecay * dt;
  if (c.state === 'work' && c.phase === 'doing') m.work += R.workFill * dt;
  else m.work -= R.workDecay * dt;
  m.errands -= R.errandsDecay * dt;
  m.fun -= R.funDecay * dt;
  if (c.state === 'free_time' && c.phase === 'doing' && c.activity)
    m[c.activity.need] += c.activity.fillRate * dt;
  for (const k in m) m[k] = clamp01_100(m[k]);
  maybeComplain(c);                  // grumble if a need is starved with no venue
  // Travel handled per-frame in updateTravel; no decisions mid-trip.
  if (c.phase === 'traveling') return;
  // Doing → transitions (hysteresis pairs; interrupts only at decision points)
  if (c.state === 'sleep') {
    if (m.energy >= CZ.energy.wakeAt) departFromHome(c);
  } else if (c.state === 'work') {
    if (m.work >= 100 && gameTime >= c.stayUntil) chooseFreeTime(c);
  } else if (c.state === 'free_time') {
    if (gameTime >= c.stayUntil) {
      if (m.energy <= CZ.energy.sleepBelow) goHome(c);
      else if (c.job && m.work <= CZ.work.startBelow) goWork(c);
      else chooseFreeTime(c);
    }
  }
}

const censusEl = document.getElementById('census');
let simAcc = 0;
const TICK = 1 / CZ.decisionHz;
function simTick(dt) {
  const g = dt * CZ.timeScale;
  gameTime += g;
  updateTravel(g);                 // smooth movement, every frame
  updateTrucks(g);
  simAcc += g;
  while (simAcc >= TICK) {         // decisions, on the slow tick
    simAcc -= TICK;
    for (const c of citizens) tickCitizen(c, TICK);
    migrationTick();
  }
  // Census (cheap enough to refresh per frame batch)
  let sleep = 0, work = 0, free = 0, jobless = 0, carsOut = 0, carsTotal = 0;
  for (const c of citizens) {
    if (c.state === 'sleep') sleep++;
    else if (c.state === 'work') work++;
    else free++;
    if (!c.job) jobless++;
    if (c.mode === 'drive') carsOut++;
  }
  for (let x = 0; x < S; x++) for (let z = 0; z < S; z++)
    if (world[x][z].cars) carsTotal += world[x][z].cars.total;
  let arriving = 0;
  for (const tr of trucks) if (tr.leg === 'inbound') arriving += tr.load;
  const day = Math.floor(gameTime / CZ.dayLength) + 1;
  const parts = [`day ${day}`, `pop ${citizens.length}`];
  if (citizens.length)
    parts.push(`😴${sleep}`, `💼${work}`, `🚶${free}`, `no-job ${jobless}`, `🚗 ${carsOut}/${carsTotal}`);
  if (arriving) parts.push(`🚚 ${arriving}`);

}

}
function applyTool(x, z) {

/* ============================== CAMERA ============================== */
const camera = new THREE.OrthographicCamera();
camera.near = 0.1; camera.far = 300;
const camTarget = new THREE.Vector3(S / 2, 0, S / 2);  // pannable look-at point
const keys = new Set();
const camState = {
  yaw: CONFIG.camera.yawAngles[0],
  yawFrom: CONFIG.camera.yawAngles[0],
  yawTo: CONFIG.camera.yawAngles[0],
  tweenT: 1,
  view: CONFIG.camera.viewStart,
  viewTarget: CONFIG.camera.viewStart,
};
// Debug/test camera hooks (stripped before ship, like the other _sim hooks).
Object.assign(window._sim, {
  camView: (v) => { camState.view = camState.viewTarget = v; },
  camTarget: (x, z) => { camTarget.x = x; camTarget.z = z; },
});
const easeInOutCubic = t =>
  t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function rotateStep(dir) {
  camState.yawFrom = camState.yaw;
  camState.yawTo = camState.yawTo + 90 * dir;
  camState.tweenT = 0;
}
function updateCamera(dt) {
  if (camState.tweenT < 1) {
    camState.tweenT = Math.min(1, camState.tweenT + dt / CONFIG.camera.rotateDur);
    const e = easeInOutCubic(camState.tweenT);
    camState.yaw = camState.yawFrom + (camState.yawTo - camState.yawFrom) * e;
  }
  camState.view += (camState.viewTarget - camState.view) *
    Math.min(1, CONFIG.camera.zoomLerp * dt);
  const yawRad = THREE.MathUtils.degToRad(camState.yaw);
  const pitchRad = THREE.MathUtils.degToRad(CONFIG.camera.pitchDeg);

  // Follow camera: slide the look-at toward the inspected citizen (indoors →
  // their tile center, traveling → their live position). Any manual pan cancels it.
  if (follow && inspected && inspected.kind === 'citizen') {
    const c = citizenById.get(inspected.id);
    if (!c) { follow = false; }
    else {
      const moving = c.phase === 'traveling' && c.pos;
      const px = moving ? c.pos[0] : c.at[0] + 0.5;
      const pz = moving ? c.pos[1] : c.at[1] + 0.5;
      const k = Math.min(1, CONFIG.camera.followLerp * dt);
      camTarget.x += (px - camTarget.x) * k;
      camTarget.z += (pz - camTarget.z) * k;
    }
  }

  // Keyboard pan, camera-relative on the ground plane.
  const fx = -Math.sin(yawRad), fz = -Math.cos(yawRad);   // screen-up
  const rx = Math.cos(yawRad), rz = -Math.sin(yawRad);    // screen-right
  let u = 0, v = 0;
  if (keys.has('w') || keys.has('arrowup')) u += 1;
  if (keys.has('s') || keys.has('arrowdown')) u -= 1;
  if (keys.has('d') || keys.has('arrowright')) v += 1;
  if (keys.has('a') || keys.has('arrowleft')) v -= 1;
  if (u || v) {
    follow = false;                       // manual pan cancels follow
    const spd = camState.view * CONFIG.camera.panKeySpeed * dt;
    camTarget.x += (fx * u + rx * v) * spd;
    camTarget.z += (fz * u + rz * v) * spd;
  }
  camTarget.x = THREE.MathUtils.clamp(camTarget.x, 0, S);
  camTarget.z = THREE.MathUtils.clamp(camTarget.z, 0, S);

  const d = CONFIG.camera.dist;
  camera.position.set(
    camTarget.x + d * Math.cos(pitchRad) * Math.sin(yawRad),
    d * Math.sin(pitchRad),
    camTarget.z + d * Math.cos(pitchRad) * Math.cos(yawRad)
  );
  camera.lookAt(camTarget);
  const aspect = window.innerWidth / window.innerHeight;
  const h = camState.view;
  camera.top = h; camera.bottom = -h;
  camera.left = -h * aspect; camera.right = h * aspect;
  camera.updateProjectionMatrix();
}

    const sy = (-_projV.y * 0.5 + 0.5) * window.innerHeight;

  for (const h of hits) {
    let o = h.object;
    while (o && !(o.userData && o.userData.kind)) o = o.parent;
    if (o) return o.userData;
  }
  return null;
}
function handleInspectTap(cx, cy) {
  const c = pickCitizen(cx, cy);
  if (c) { openCitizenCard(c); return; }
  const b = pickBuilding(cx, cy);
  if (b) openBuildingCard(b.x, b.z);
  else closeCard();
}
// Debug/test surface (paired with window._sim.apply; stripped before v0.2/v0.3 ship).
Object.assign(window._sim, { nameFor, inspectCitizen: openCitizenCard,
  inspectBuilding: openBuildingCard, closeCard, handleInspectTap, pickCitizen,
  screenOf: (c) => {
    _projV.set(c.pos[0], 0.3, c.pos[1]).project(camera);
    return [(_projV.x * 0.5 + 0.5) * window.innerWidth, (-_projV.y * 0.5 + 0.5) * window.innerHeight];
  },
  getInspected: () => inspected, getFollow: () => follow,
  getCamTarget: () => [camTarget.x, camTarget.z] });

/* ============================= BUBBLES ============================= */
// Billboard emoji above heads. Thought bubbles fire at decision points (sparse
// — no per-frame cost); complaint bubbles fire when a need is starved AND no
// venue for it exists in town — the city grumbling what to build next.
const bubbleTex = new Map();
function emojiTexture(str) {
  let tex = bubbleTex.get(str);
  if (tex) return tex;
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const ctx = cv.getContext('2d');
  ctx.font = '42px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(str, 32, 36);
  tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  bubbleTex.set(str, tex); return tex;                 // cached + shared, never disposed
}
const bubbles = new Map();          // citizen id -> { sprite, until }
function showBubble(c, str, dur = CZ.bubbles.showSeconds) {
  let b = bubbles.get(c.id);
  if (!b) {
    const mat = new THREE.SpriteMaterial({ map: emojiTexture(str), transparent: true, depthTest: false });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(0.55, 0.55, 0.55); sprite.renderOrder = 999;
    scene.add(sprite);
    b = { sprite }; bubbles.set(c.id, b);
  } else {
    b.sprite.material.map = emojiTexture(str);
  }
  b.until = gameTime + dur;
}
const COMPLAINT_ICON = { errands: '🛒❓', fun: '🎈❓' };
let servedNeeds = new Set();
let complaintCount = 0;             // debug/test counter
// Which advert-needs have a REACHABLE venue. Reachability-gated so a shop you
// placed but never connected still lets citizens grumble (visible consequence).
// Recomputed on world change only (via applyTool), not per frame.
function computeServedNeeds() {
  servedNeeds.clear();
  for (let x = 0; x < S; x++) for (let z = 0; z < S; z++) {
    const ad = RT.adverts[world[x][z].type];
    if (ad && hasConnectedRoadNeighbor(x, z)) servedNeeds.add(ad.need);
  }
}
function maybeComplain(c) {
  if (gameTime < (c.nextComplaint || 0)) return;
  for (const need in COMPLAINT_ICON) {
    if (c.meters[need] <= CZ.bubbles.starvedBelow && !servedNeeds.has(need)) {
      if (Math.random() < CZ.bubbles.complaintChance) {
        showBubble(c, COMPLAINT_ICON[need]);
        c.nextComplaint = gameTime + RT.complaintCooldown;
        complaintCount++;
      }
      return;
    }
  }
}
function updateBubbles() {
  if (bubbles.size === 0) return;
  for (const [id, b] of bubbles) {
    const c = citizenById.get(id);
    if (!c || gameTime > b.until) {
      scene.remove(b.sprite); b.sprite.material.dispose(); bubbles.delete(id); continue;
    }
    const moving = c.phase === 'traveling' && c.pos;
    const x = moving ? c.pos[0] : c.at[0] + 0.5;
    const z = moving ? c.pos[1] : c.at[1] + 0.5;
    b.sprite.position.set(x, 0.75, z);
  }
}
Object.assign(window._sim, { showBubble, getBubbleCount: () => bubbles.size,
  getServedNeeds: () => [...servedNeeds], getComplaintCount: () => complaintCount });

/* =============================== INPUT ============================== */
document.getElementById('btn-cw').addEventListener('click', () => rotateStep(1));
document.getElementById('btn-ccw').addEventListener('click', () => rotateStep(-1));
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'q') rotateStep(-1);
  if (k === 'e') rotateStep(1);
  keys.add(k);
});
window.addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
window.addEventListener('blur', () => keys.clear());

document.querySelectorAll('#toolbar button').forEach(btn => {
  btn.addEventListener('click', () => {
    tool = btn.dataset.tool;
    document.querySelectorAll('#toolbar button')
      .forEach(b => b.classList.toggle('selected', b === btn));
  });
});
document.querySelector('#toolbar button[data-tool="road"]').classList.add('selected');

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  const f = Math.exp(e.deltaY * 0.0012);
  camState.viewTarget = THREE.MathUtils.clamp(
    camState.viewTarget * f, CONFIG.camera.viewMin, CONFIG.camera.viewMax);
}, { passive: false });

// Pointer handling. Rules:
// - 2 active pointers => pinch zoom; the gesture is poisoned for taps.
// - 1 pointer, moved < tapMaxMove px, never multi-touch => tap => place.
const pointers = new Map();
let pinchStartDist = 0, pinchStartView = 0;
let gestureMulti = false;

renderer.domElement.addEventListener('pointerdown', (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY,
                              sx: e.clientX, sy: e.clientY });
  if (pointers.size === 2) {
    gestureMulti = true;
    const [a, b] = [...pointers.values()];
    pinchStartDist = Math.hypot(a.x - b.x, a.y - b.y);
    pinchStartView = camState.viewTarget;
  }
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'mouse' && pointers.size === 0) {
    updateGhost(pickTile(e.clientX, e.clientY));  // desktop hover preview
  }
  const p = pointers.get(e.pointerId);
  if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  // Single-pointer drag = pan. The grabbed ground point stays under the
  // pointer; the tap threshold keeps small jitters as taps.
  if (pointers.size === 1 && !gestureMulti) {
    if (!p.pan && Math.hypot(p.x - p.sx, p.y - p.sy) >= CONFIG.input.tapMaxMove) {
      p.pan = pickGround(p.sx, p.sy);
      ghost.visible = false;
    }
    if (p.pan) {
      follow = false;                     // drag pan cancels follow
      const hit = pickGround(e.clientX, e.clientY);
      if (hit) { camTarget.x += p.pan.x - hit.x; camTarget.z += p.pan.z - hit.z; }
    }
  }
  if (pointers.size === 2 && pinchStartDist > 0) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    camState.viewTarget = THREE.MathUtils.clamp(
      pinchStartView * (pinchStartDist / d),
      CONFIG.camera.viewMin, CONFIG.camera.viewMax);
  }
});
function releasePointer(e) {
  const p = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStartDist = 0;
  if (!p) return;
  const moved = Math.hypot(p.x - p.sx, p.y - p.sy);
  if (!gestureMulti && moved < CONFIG.input.tapMaxMove && e.type === 'pointerup') {
    if (tool === 'inspect') {
      handleInspectTap(e.clientX, e.clientY);
    } else {
      const tile = pickTile(e.clientX, e.clientY);
      if (tile) applyTool(tile[0], tile[1]);
    }
    if (e.pointerType !== 'mouse') ghost.visible = false;
  }
  if (pointers.size === 0) gestureMulti = false;
}
renderer.domElement.addEventListener('pointerup', releasePointer);
renderer.domElement.addEventListener('pointercancel', releasePointer);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ==================== DAY/NIGHT + WORLD FX (v0.4) ==================== */
// Purely visual. Citizens never read `dayT`, so the no-shared-clock rule holds.
const DN = CONFIG.daynight;
let dayT = DN.startT;
const _c2 = new THREE.Color();
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const lerpHex = (out, a, b, t) => out.setHex(a).lerp(_c2.setHex(b), t);

// Chimney smoke: a small shared pool of puffs rising from random house chimneys.
const smokeGeo = new THREE.SphereGeometry(0.07, 8, 6);
const smokes = [];
for (let i = 0; i < 10; i++) {
  const m = new THREE.Mesh(smokeGeo, new THREE.MeshStandardMaterial({ color: 0xf4f4f6, transparent: true, opacity: 0, roughness: 1 }));
  m.visible = false; scene.add(m); smokes.push({ m, t: 0, from: new THREE.Vector3(), active: false });
}
let chimneys = [];
function refreshChimneys() {              // rebuilt on world change (not per frame)
  chimneys = [];
  for (const s of smokes) { s.active = false; s.m.visible = false; }   // drop puffs over changed tiles
  for (let x = 0; x < S; x++) for (let z = 0; z < S; z++) {
    const t = world[x][z];
    if (t.type === 'house') {
      const two = t.level >= 2, w = two ? 0.66 : 0.6, h = two ? 0.82 : 0.5;
      chimneys.push(new THREE.Vector3(x + 0.5 + w * 0.28, h + 0.25, z + 0.5 + w * 0.2));
    }
  }
}

// A few little birds drifting across the sky.
const birdMat = new THREE.MeshBasicMaterial({ color: 0x3a4049 });
const birdGeo = new THREE.BoxGeometry(0.14, 0.012, 0.03);
const birds = [];
for (let i = 0; i < 4; i++) {
  const g = new THREE.Group();
  const a = new THREE.Mesh(birdGeo, birdMat); a.rotation.y = 0.5; a.position.x = -0.06;
  const b = new THREE.Mesh(birdGeo, birdMat); b.rotation.y = -0.5; b.position.x = 0.06;
  g.add(a, b); g.rotation.y = Math.PI / 2; scene.add(g);
  birds.push({ g, a, b, off: (i * 5) % S, lane: 3 + i * 3.5, speed: 0.7 + i * 0.12, y: 6 + i });
}

function updateWorldFX(dt) {
  dayT = (dayT + dt / DN.cycleSeconds) % 1;
  const ang = (dayT - 0.25) * Math.PI * 2;         // 0 sunrise · π/2 noon · π sunset
  const sunEl = Math.sin(ang);                     // -1 midnight .. 1 noon
  const light = clamp01((sunEl + 0.12) / 0.5);     // 0 night .. 1 day
  const dark = 1 - light;
  const horizon = clamp01(1 - Math.abs(sunEl) * 2.2) * light;  // dawn/dusk warmth

  sun.position.set(CENTER.x + Math.cos(ang) * S * 0.9, Math.max(DN.sunHeightMin, sunEl * S * 1.15), CENTER.z + S * 0.35);
  lerpHex(sun.color, DN.sunMoon, DN.sunDaylight, light); sun.color.lerp(_c2.setHex(DN.sunDusk), horizon * 0.6);
  sun.intensity = DN.sunNight + light * DN.sunDay;

  lerpHex(scene.background, DN.nightSky, DN.daySky, light); scene.background.lerp(_c2.setHex(DN.warmSky), horizon * 0.55);
  scene.fog.color.copy(scene.background); scene.fog.density = dark * DN.fogNight;
  lerpHex(ambient.color, DN.ambNightCol, DN.ambDayCol, light); ambient.intensity = DN.ambNight + light * DN.ambDay;

  windowMat.emissiveIntensity = dark * DN.glow.window;
  lampMat.emissiveIntensity = 0.12 + dark * DN.glow.lamp;
  signMat.emissiveIntensity = 0.12 + dark * DN.glow.sign;

  for (const s of smokes) {                         // chimney smoke (pooled, no per-frame alloc)
    if (!s.active) {
      if (chimneys.length && Math.random() < DN.smokeSpawn) {
        s.from.copy(chimneys[(Math.random() * chimneys.length) | 0]); s.t = 0; s.active = true; s.m.visible = true;
      } else continue;
    }
    s.t += dt * 0.4;
    if (s.t >= 1) { s.active = false; s.m.visible = false; continue; }
    s.m.position.set(s.from.x + Math.sin(s.t * 4) * 0.04, s.from.y + s.t * 0.5, s.from.z);
    s.m.scale.setScalar(0.5 + s.t * 1.2);
    s.m.material.opacity = (1 - s.t) * 0.5;
  }
  for (const bd of birds) {                          // drifting birds
    bd.off += dt * bd.speed;
    bd.g.position.set(((bd.off % (S + 6)) - 3), bd.y, bd.lane);
    bd.a.position.y = bd.b.position.y = Math.sin(bd.off * 6) * 0.03;
  }
}
Object.assign(window._sim, { setDayT: (t) => { dayT = t; }, getDayT: () => dayT, refreshChimneys });

/* ============================= MAIN LOOP ============================ */
computeServedNeeds();          // initialize the complaint gate before the loop
refreshChimneys();
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  updateCamera(dt);
  updateAnims(dt);
  growthTick(dt);
  simTick(dt);
  updateAgentMeshes();
  updateTruckMeshes();
  updateBubbles();
  updateInspector();
  updateWorldFX(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
